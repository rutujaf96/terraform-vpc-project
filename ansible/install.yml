---
- name: Install Java, Docker, AWS CLI, kubectl and Minikube
  hosts: web
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - openjdk-21-jdk
          - docker.io
          - curl
          - unzip
          - conntrack
          - socat
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Check AWS CLI
      command: aws --version
      register: aws_cli_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'
      when: aws_cli_check.rc != 0

    - name: Extract AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_cli_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      when: aws_cli_check.rc != 0

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Minikube
      get_url:
        url: https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false

    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Verify Minikube
      command: minikube version
      register: minikube_version
      changed_when: false

    - name: Show installed versions
      debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ aws_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "{{ minikube_version.stdout }}"
