apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: kube-system
type: Opaque
stringData:
  admin-user: admin
  admin-password: Admin@12345

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: kube-system
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: kube-system
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "Spring Boot Monitoring"
        orgId: 1
        folder: "Spring Boot Monitoring"
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10

        options:
          path: /etc/grafana/provisioned-dashboards

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kube-system

  labels:
    app: grafana

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:

      securityContext:
        fsGroup: 472

      containers:

        - name: grafana

          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: web
              containerPort: 3000
              protocol: TCP

          env:

            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          readinessProbe:
            httpGet:
              path: /api/health
              port: web

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: web

            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:

            # Grafana persistent data
            - name: grafana-data
              mountPath: /var/lib/grafana

            # Prometheus datasource provisioning
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            # Dashboard provider configuration
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            # Dashboard JSON files
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioned-dashboards
              readOnly: true

      volumes:

        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data

        - name: grafana-datasource
          configMap:
            name: grafana-datasource

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: kube-system

  labels:
    app: grafana

spec:
  type: ClusterIP

  selector:
    app: grafana

  ports:

    - name: web
      port: 3000
      targetPort: web
      protocol: TCP
